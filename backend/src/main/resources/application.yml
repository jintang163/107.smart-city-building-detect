server:
  port: 8080

spring:
  application:
    name: ucm-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ucm
    username: ${DB_USER:ucm}
    password: ${DB_PASSWORD:ucm123456}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket:
    imagery: imagery      # 航拍影像
    evidence: evidence    # 现场核查照片

ai:
  detect-url: ${AI_DETECT_URL:http://localhost:8000/detect}
  connect-timeout-ms: 10000
  read-timeout-ms: 300000

# 智能分析模块
analysis:
  alert:
    scan-interval-ms: 3600000   # 超期预警扫描间隔（默认每小时）
